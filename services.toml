# Build and serve in one process: node lazily imports the route chunks in
# build/, so a rebuild that lands after the server boots renames chunks out
# from under it and every request 500s. `&&` keeps them strictly sequential.
[web]
run = "node_modules/.bin/vite build && node build/index.js"
restart = true
ports = [5273]
env ={ HOST = "0.0.0.0", PORT = "5273", ORIGIN = "https://cms.xcc.es", BLOG_CONTENT_BASE_DIR = "~/dev/blog", SVELTE_BLOG_DIR = "~/dev/blog-loke", ASTRO_BLOG_DIR = "~/dev/blog-astro" }
